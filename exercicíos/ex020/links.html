<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }

        .especial {
            background-color: rgb(255, 147, 147);
        }
        
        .especial::before {
            content: '🡆';
        }

        .especial::after {
            content: '🡄';
        }

    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://youtube.com/@lucasjogvop7543?si=P_fprgNq97jZcjIK" target="_blank" type="external">Canal do Youtube</a></li>
        <li><a href="https://www.instagram.com/lucasehostim" target="_blank" type="external">Instagram Principal</a></li>
        <li><a href="https://www.instagram.com/todo_dia_monster_de_cafe" target="_blank" type="external" class="especial">Instagram Automático</a></li>
    </ul>
</body>
</html>
