<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif;}

        div > p {
            display: none;
        }

        div:hover > p {
            display:block;
            color: white;
            background-color: red;
            width: 150px;
        }

        div:hover {
            color: red;
        }
    </style>
</head>
<body>
    <h1>passe o mouse no texto abaixo</h1>
    <div>
        passe o mouse aqui
        <p>Texto oculto XD</p>
    </div>
</body>
</html>
